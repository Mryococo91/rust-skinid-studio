name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test rss-core (offline / dry-run)
        run: cargo test -p rss-core
      - name: Build spike CLI
        run: cargo build -p rss-spike
      - name: Dry-run spike
        run: |
          cargo run -p rss-spike -- spike --image tests/fixtures/sample.png --out tmp/ci-spike --mode dry-run

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Typecheck / build frontend
        run: bun run build
      - name: Check Tauri backend compiles
        working-directory: .
        run: cargo check -p rust-supply-signal-studio --features steam
      - name: Clippy (rss-core)
        working-directory: .
        run: cargo clippy -p rss-core -- -D warnings
